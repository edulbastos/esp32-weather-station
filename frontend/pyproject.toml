[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-frontend"
dynamic = ["version"]
description = "Read-only web frontend for the ESP32 weather stations, fed by their MQTT messages"
requires-python = ">=3.11"
dependencies = [
    "fastapi", "uvicorn[standard]", "python-multipart", "aiomqtt", "argon2-cffi",
]

[project.scripts]
weather-frontend = "weather_frontend.cli:main"

[tool.setuptools]
packages = ["weather_frontend"]

[tool.setuptools.dynamic]
version = { attr = "weather_frontend.__version__" }

[tool.setuptools.package-data]
weather_frontend = ["pages/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
