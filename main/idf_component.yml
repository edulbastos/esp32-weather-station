## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=6.1.0'
  # MQTT client (FR-6.x). Not part of ESP-IDF since v6.0; downloaded from the
  # ESP Component Registry into managed_components/ on the first build.
  espressif/mqtt: '^1.1.0'
  # QR code encoder (FR-12.8), the Nayuki library wrapped by Espressif.
  espressif/qrcode: '^0.2.0'
