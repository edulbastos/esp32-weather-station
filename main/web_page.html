<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Station</title>
<!-- Tab icon (sun behind a cloud), embedded so the browser does not ask for /favicon.ico -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='12' r='7' fill='%23f59f00'/%3E%3Cpath d='M9 26h15a6 6 0 0 0 0-12a8 8 0 0 0-15 3a4.5 4.5 0 0 0 0 9z' fill='%2362adff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1b2330; --muted: #677085; --line: #e3e6eb;
    --temp: #d9480f; --hum: #1c6dc9; --pres: #2b8a3e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151b; --card: #1a2029; --text: #e6e9ee; --muted: #8b95a7; --line: #2a323e;
      --temp: #ff8c5a; --hum: #62adff; --pres: #5fd07a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  .status-box { margin-left: auto; text-align: right; }
  .status { display: block; color: var(--muted); font-size: 13px; }
  .status.error { color: var(--temp); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .label { color: var(--muted); font-size: 13px; }
  .value { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .unit { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .charts { display: grid; gap: 12px; }
  .chart svg { display: block; width: 100%; height: 170px; margin-top: 4px; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .chart .grid { stroke: var(--line); }
  .chart svg { touch-action: pan-y; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  .chart .cursor { pointer-events: none; }
  .chart .cursor line { stroke: var(--muted); stroke-dasharray: 3 3; }
  .chart .cursor circle { stroke: var(--card); stroke-width: 2; }
  .chart .cursor text { fill: var(--text); font-weight: 600; font-variant-numeric: tabular-nums;
                        paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
  a { color: var(--hum); }
  footer { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
                gap: 8px; margin: 24px 0 8px; }
  .chart-head h2 { margin: 0; }
  .ranges { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .ranges button { font: inherit; font-size: 13px; padding: 4px 12px; border: 0; cursor: pointer;
                   background: var(--card); color: var(--muted); }
  .ranges button + button { border-left: 1px solid var(--line); }
  .ranges button[aria-pressed="true"] { background: var(--hum); color: #fff; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Weather Station</h1>
    <div class="status-box">
      <span class="status" id="status">Connecting…</span>
      <span class="status" id="rssi"></span>
    </div>
  </header>

  <section class="cards">
    <div class="card"><div class="label">Temperature</div>
      <div class="value"><span id="temp">--.-</span><span class="unit">°C</span></div></div>
    <div class="card"><div class="label">Humidity</div>
      <div class="value"><span id="hum">--.-</span><span class="unit">%RH</span></div></div>
    <div class="card"><div class="label">Pressure</div>
      <div class="value"><span id="pres">----.-</span><span class="unit">hPa</span></div></div>
  </section>

  <div class="chart-head">
    <h2>Last <span id="range-label">24 hours</span></h2>
    <div class="ranges" role="group" aria-label="Chart period">
      <button type="button" data-hours="1">1 h</button>
      <button type="button" data-hours="24">24 h</button>
      <button type="button" data-hours="168">7 d</button>
    </div>
  </div>
  <section class="charts">
    <div class="card chart"><div class="label">Temperature (°C)</div><svg id="chart-temp"></svg></div>
    <div class="card chart"><div class="label">Humidity (%RH)</div><svg id="chart-hum"></svg></div>
    <div class="card chart"><div class="label">Pressure (hPa)</div><svg id="chart-pres"></svg></div>
  </section>

  <footer>
    <a href="/history.csv" download>Download the full history (CSV)</a>
    · <span id="history-info"></span>
    <div id="station"></div>
  </footer>
</main>

<script>
const RANGES = { 1: "hour", 24: "24 hours", 168: "7 days" };
const RESYNC_MS = 30 * 60 * 1000;  // full reload of the chart data
const HISTORY_TIMEOUT_MS = 20000;  // give up waiting for the history...
const HISTORY_RETRY_MS = 5000;     // ...and try again after this
const $ = (id) => document.getElementById(id);
// The three charts: series index in a point's v, colour, axis digits, unit.
const CHARTS = [
  { id: "chart-temp", color: "var(--temp)", digits: 1, unit: "°C" },
  { id: "chart-hum", color: "var(--hum)", digits: 0, unit: "%RH" },
  { id: "chart-pres", color: "var(--pres)", digits: 1, unit: "hPa" },
];

let hours = 24;
try {
  const saved = Number(localStorage.getItem("chart-hours"));
  if (RANGES[saved]) hours = saved;
} catch (e) { /* storage unavailable: keep the default */ }

// Chart data per period (hours -> chart). Points are { t, v: [temp, hum,
// pres], n }: points from the station have n = 0 (already averaged), points
// added by the page count the measurements averaged into them. All periods are
// loaded when the page opens, so switching between them needs no request.
const PERIODS = [1, 24, 168];
const data = {};
const historyGen = {}, retryTimers = {};
let resyncTimer = null, loadAllGen = 0;
let currentTimer = null;
// Each call increments its counter; an answer that arrives after a newer
// call has started is dropped, so only one polling loop ever runs.
let currentGen = 0;
let measurePeriod = 60;  // s, from /api/current
// FR-8.7: cursor shared by the three charts. cursorT is the time under the
// pointer (null: hidden); it is kept across redraws, so new measurements do
// not hide it. scales holds the axes of each drawn chart (chart id -> scale).
let cursorT = null;
const scales = {};

function fmtTime(unix) {
  return new Date(unix * 1000).toLocaleString([], { dateStyle: "short", timeStyle: "medium" });
}

function fmtDuration(s) {
  return s >= 3600 ? +(s / 3600).toFixed(1) + " h" : s >= 60 ? Math.round(s / 60) + " min" : s + " s";
}

function setStatus(text, error) {
  $("status").textContent = text;
  $("status").classList.toggle("error", !!error);
}

// FR-10.5: the station's name (or identifier) in the tab title, and its
// device and sensor identifiers in the footer.
function showStation(d) {
  const label = d.name || d.device_id;
  document.title = label + " · Weather Station";
  $("station").textContent = (d.name ? d.name + " · " : "") + "device " + d.device_id +
    (d.sensor_id ? " · sensor " + d.sensor_id : "");
}

// FR-8.2: current values, refreshed at the measurement interval. Each new
// measurement is also added to the charts (FR-8.4).
async function loadCurrent() {
  clearTimeout(currentTimer);
  const gen = ++currentGen;
  let delay = 5000;
  try {
    const r = await fetch("/api/current", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (gen !== currentGen) return;
    measurePeriod = d.measure_period_s;
    showStation(d);
    delay = Math.max(1000, d.measure_period_s * 1000);
    // FR-5.8: the RSSI on a line of its own, below the signal bars.
    const wifi = d.wifi_level > 0 ? " · Wi-Fi " + "▂▄▆".slice(0, d.wifi_level) : "";
    $("rssi").textContent = d.rssi_dbm != null ? d.rssi_dbm + " dBm" : "";
    if (d.valid) {
      $("temp").textContent = d.temperature_c.toFixed(1);
      $("hum").textContent = d.humidity_rh.toFixed(1);
      $("pres").textContent = d.pressure_hpa.toFixed(1);
      const when = d.time ? fmtTime(d.time) : "clock not synchronized";
      setStatus("Measured " + when + wifi, false);
      if (d.time) addPoint(d.time, [d.temperature_c, d.humidity_rh, d.pressure_hpa]);
    } else {
      $("temp").textContent = $("hum").textContent = "--.-";
      $("pres").textContent = "----.-";
      setStatus("Sensor error" + wifi, true);
    }
  } catch (e) {
    if (gen !== currentGen) return;
    setStatus("Station unreachable, retrying…", true);
    $("rssi").textContent = "";
  }
  currentTimer = setTimeout(loadCurrent, delay);
}

// FR-8.4: chart data of one period, about 150 points averaged by the
// station. On a weak Wi-Fi link an answer can take very long; give up after
// HISTORY_TIMEOUT_MS and try that period again after HISTORY_RETRY_MS.
async function loadHistory(h) {
  clearTimeout(retryTimers[h]);
  const gen = historyGen[h] = (historyGen[h] || 0) + 1;
  const abort = new AbortController();
  const timer = setTimeout(() => abort.abort(), HISTORY_TIMEOUT_MS);
  try {
    const r = await fetch("/api/history?hours=" + h, { cache: "no-store", signal: abort.signal });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (gen !== historyGen[h]) return;  // a newer load of this period started
    const step = d.source === "measurements" ? d.measure_period_s : d.log_period_s;
    data[h] = {
      loadedAt: Date.now(),
      logPeriod: d.log_period_s,
      bucket: d.bucket_s,
      gap: 3 * Math.max(d.bucket_s, step),  // longer pauses break the line
      points: d.records.map((x) => ({ t: x[0], v: [x[1], x[2], x[3]], n: 0 })),
      lastAdded: d.records.length ? d.records[d.records.length - 1][0] : 0,
      info: !d.available ? "history not available"
        : d.bucket_s > step ? "each point is the average of " + fmtDuration(d.bucket_s)
        : "one point per measurement",
    };
    if (h === hours) drawCharts();
  } catch (e) {
    if (gen !== historyGen[h]) return;
    if (h === hours && !data[h]) {
      $("history-info").textContent = e.name === "AbortError"
        ? "station slow to answer, retrying…" : "history could not be loaded, retrying…";
    }
    retryTimers[h] = setTimeout(() => loadHistory(h), HISTORY_RETRY_MS);
  } finally {
    clearTimeout(timer);
  }
}

// Loads every period, the selected one first; the station answers one
// request at a time. Runs when the page opens, when it becomes visible
// again, after missed measurements, and every RESYNC_MS.
async function loadAll() {
  clearTimeout(resyncTimer);
  const gen = ++loadAllGen;
  for (const h of [hours, ...PERIODS.filter((p) => p !== hours)]) {
    if (gen !== loadAllGen) return;  // a newer loadAll took over
    await loadHistory(h);
  }
  if (gen === loadAllGen) resyncTimer = setTimeout(loadAll, RESYNC_MS);
}

// Adds a measurement to every period without asking the station again. It
// is averaged into the last point while that point is younger than one
// bucket of its period, so the number of points stays the same over time.
function addPoint(t, v) {
  // Measurements were missed (tab in the background, computer asleep...):
  // the station has them, so reload instead of leaving a gap. At most once a
  // minute, in case the data really have a gap.
  const sel = data[hours];
  if (sel && sel.lastAdded > 0 && t > sel.lastAdded) {
    const maxStep = 2 * Math.max(measurePeriod, sel.logPeriod) + 10;
    if (t - sel.lastAdded > maxStep && Date.now() - sel.loadedAt > 60000) {
      loadAll();
      return;
    }
  }
  for (const h of PERIODS) {
    const c = data[h];
    // The page asks at every measurement interval; add each measurement once.
    if (!c || t <= c.lastAdded) continue;
    c.lastAdded = t;
    const pts = c.points, last = pts[pts.length - 1];
    if (last && last.n > 0 && t - last.start < c.bucket) {
      last.v = last.v.map((x, i) => (x * last.n + v[i]) / (last.n + 1));
      last.t = (last.t * last.n + t) / (last.n + 1);
      last.n++;
    } else {
      pts.push({ t, v, n: 1, start: t });
    }
    const cutoff = t - h * 3600;
    while (pts.length && pts[0].t < cutoff) pts.shift();
  }
  drawCharts();
}

// Shown until the data of the selected period arrive.
function showLoading() {
  for (const { id } of CHARTS) {
    const svg = $(id), W = svg.clientWidth || 600;
    scales[id] = null;
    svg.setAttribute("viewBox", `0 0 ${W} 170`);
    svg.innerHTML = `<text x="${W / 2}" y="85" text-anchor="middle">Loading…</text>`;
  }
  $("history-info").textContent = "loading…";
}

function drawCharts() {
  const chart = data[hours];
  if (!chart) return;
  $("history-info").textContent = chart.info;
  CHARTS.forEach((c, i) => {
    drawChart($(c.id), chart.points.map((p) => [p.t, p.v[i]]), c.color, c.digits, chart.gap);
  });
  drawCursor();
}

function drawChart(svg, pts, color, digits, gap) {
  const W = svg.clientWidth || 600, H = 170;
  const L = 46, R = 10, T = 8, B = 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  scales[svg.id] = null;
  if (pts.length < 2) {
    svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">No data yet</text>`;
    return;
  }

  const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  let vmin = Math.min(...pts.map((p) => p[1])), vmax = Math.max(...pts.map((p) => p[1]));
  const pad = Math.max((vmax - vmin) * 0.1, Math.pow(10, -digits));
  vmin -= pad; vmax += pad;
  const x = (t) => L + (t - t0) / Math.max(1, t1 - t0) * (W - L - R);
  const y = (v) => T + (vmax - v) / (vmax - vmin) * (H - T - B);

  let out = "";
  for (let i = 0; i <= 3; i++) {                 // horizontal grid and values
    const v = vmin + (vmax - vmin) * i / 3, yy = y(v).toFixed(1);
    out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/>`;
    out += `<text x="${L - 6}" y="${yy}" dy="4" text-anchor="end">${v.toFixed(digits)}</text>`;
  }
  const ticks = W < 420 ? 2 : 4;
  const days = t1 - t0 > 2 * 86400;              // 7 days: show dates
  for (let i = 0; i <= ticks; i++) {             // time axis
    const t = t0 + (t1 - t0) * i / ticks, date = new Date(t * 1000);
    const label = days ? date.toLocaleDateString([], { day: "2-digit", month: "2-digit" })
                       : date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const anchor = i === 0 ? "start" : i === ticks ? "end" : "middle";
    out += `<text x="${x(t).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${label}</text>`;
  }

  let d = "", prev = null;
  for (const [t, v] of pts) {
    d += (prev === null || t - prev > gap ? "M" : "L") + x(t).toFixed(1) + "," + y(v).toFixed(1);
    prev = t;
  }
  out += `<path d="${d}" style="fill:none;stroke:${color};stroke-width:1.8;stroke-linejoin:round"/>`;
  out += `<g class="cursor"></g>`;
  svg.innerHTML = out;
  scales[svg.id] = { x, y, t0, t1, W, H, L, R, T, B };
}

// Point of pts (sorted by time) closest to time t.
function nearestPoint(pts, t) {
  let lo = 0, hi = pts.length - 1;
  if (hi < 0) return null;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (pts[mid].t < t) lo = mid; else hi = mid;
  }
  return Math.abs(pts[lo].t - t) <= Math.abs(pts[hi].t - t) ? pts[lo] : pts[hi];
}

function fmtCursorTime(t) {
  const date = new Date(t * 1000);
  if (hours === 168) {
    return date.toLocaleString([], { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  }
  return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit",
                                       second: hours === 1 ? "2-digit" : undefined });
}

// FR-8.7: vertical line, dot and value at the point closest to cursorT, in
// all three charts. Hidden inside a break of the line.
function drawCursor() {
  const chart = data[hours];
  let p = null;
  if (chart && cursorT !== null) {
    p = nearestPoint(chart.points, cursorT);
    if (p && Math.abs(p.t - cursorT) > chart.gap / 2) p = null;
  }
  CHARTS.forEach((c, i) => {
    const svg = $(c.id), s = scales[c.id], g = svg.querySelector(".cursor");
    if (!g) return;
    if (!p || !s) {
      g.innerHTML = "";
      return;
    }
    const xx = s.x(p.t), yy = s.y(p.v[i]);
    const left = xx > (s.L + s.W - s.R) / 2;  // label on the side with more room
    const label = `${p.v[i].toFixed(1)} ${c.unit} · ${fmtCursorTime(p.t)}`;
    g.innerHTML =
      `<line x1="${xx.toFixed(1)}" x2="${xx.toFixed(1)}" y1="${s.T}" y2="${s.H - s.B}"/>` +
      `<circle cx="${xx.toFixed(1)}" cy="${yy.toFixed(1)}" r="4" style="fill:${c.color}"/>` +
      `<text x="${(left ? xx - 6 : xx + 6).toFixed(1)}" y="${s.T + 10}" ` +
      `text-anchor="${left ? "end" : "start"}">${label}</text>`;
  });
}

// Pointer position over a chart -> cursor time. Mouse: follows the pointer.
// Touch: shown while the finger touches or slides along a chart, and kept
// after it lifts until the page is touched outside the charts.
function moveCursor(e) {
  const s = scales[e.currentTarget.id];
  if (!s) return;
  const r = e.currentTarget.getBoundingClientRect();
  const px = (e.clientX - r.left) * s.W / r.width;
  const f = Math.min(1, Math.max(0, (px - s.L) / (s.W - s.L - s.R)));
  cursorT = s.t0 + f * (s.t1 - s.t0);
  drawCursor();
}

function hideCursor() {
  if (cursorT === null) return;
  cursorT = null;
  drawCursor();
}

for (const { id } of CHARTS) {
  const svg = $(id);
  svg.addEventListener("pointermove", moveCursor);
  svg.addEventListener("pointerdown", moveCursor);
  svg.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") hideCursor(); });
}
document.addEventListener("pointerdown", (e) => {
  if (!e.target.closest || !e.target.closest(".chart svg")) hideCursor();
});

// Shows a period: from memory when its data are loaded (instant), else
// "Loading…" until they arrive.
function selectRange(h) {
  hours = h;
  cursorT = null;
  try { localStorage.setItem("chart-hours", String(h)); } catch (e) { /* not essential */ }
  $("range-label").textContent = RANGES[h];
  document.querySelectorAll(".ranges button").forEach((b) => {
    b.setAttribute("aria-pressed", String(Number(b.dataset.hours) === h));
  });
  if (data[h]) {
    drawCharts();
  } else {
    showLoading();
  }
}

document.querySelectorAll(".ranges button").forEach((b) => {
  b.addEventListener("click", () => selectRange(Number(b.dataset.hours)));
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawCharts, 150);
});

// Timers are slowed down or frozen while the page is hidden; catch up at once
// when it is shown again.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    loadCurrent();
    loadAll();
  }
});

selectRange(hours);
loadAll();
loadCurrent();
</script>
</body>
</html>
